[project]
name = "content-engine"
version = "0.1.0"
description = "Système de production de vidéos courtes piloté par IA"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6",
  "requests>=2.31",
  "python-dotenv>=1.0",
  "yt-dlp>=2025.1.1",
  "curl_cffi>=0.7",
  "anthropic>=0.40",
  "instaloader>=4.10",
  "mcp>=1.2,<2",
  "faster-whisper>=1.0",
  "numpy",
  "playwright>=1.40",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
engine = "engine.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["engine*"]
