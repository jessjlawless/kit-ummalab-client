# Hook Lab — décortique les hooks des meilleurs créateurs sur 4 canaux (verbal, texte, visuel, auditif).
# Pour chaque créateur : ses meilleures vidéos (score outlier = vues / médiane de SON compte), jamais les vues brutes.
# Handles vérifiés le 2026-10-18 (yt-dlp / navigateur). « à vérifier » = le collecteur confirme ou marque « introuvable ».
# Ajoute un créateur ici ou depuis le dashboard (Hook Lab → + Créateur).
per_creator: 10          # vidéos décortiquées par créateur (les meilleures)
min_score: 2.0           # score outlier minimum (sauf vidéos de départ = seeds)
max_duration_s: 120      # vidéos courtes seulement
lookback_days: 365       # on cherche les meilleurs hooks de l'année, pas seulement du mois
videos_per_account: 60   # vidéos récupérées par compte pour calculer la médiane

creators:
  # Experts du contenu court (valables pour toutes les niches). AJOUTE ici 5 à 10 créateurs QUI MARCHENT DANS TA NICHE
