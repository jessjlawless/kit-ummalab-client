- id: storytime
  name: 'Storytime : le moment qui a tout changé'
  description: Une histoire vraie racontée en « mais / donc », avec un enjeu, un échec et une leçon. C'est ce qui crée l'attachement
    à la personne derrière le compte.
  script_structure: hook in medias res (le pire ou le meilleur moment) → le contexte en une phrase → mais… (l'obstacle) →
    donc… (la décision) → le résultat honnête → la leçon → CTA follow
  edit_template:
    format: face cam 9:16 assis, cadrage serré, 2-3 inserts photo/vidéo d'archive
    pacing: 'rythme en vague : début rapide, milieu posé, fin très concise ; silence d''une demi-seconde avant la chute'
    subtitles: mot-à-mot, 2-3 mots par ligne, blanc contour noir, centre-bas
    broll:
    - photos ou vidéos d'archive du moment raconté
    - objet lié à l'histoire en gros plan
    - plan de toi aujourd'hui (contraste avant/après)
    on_screen_text: l'année ou le lieu du moment raconté en haut (ex. « 2023 · MON PREMIER CLIENT »)
    music: voix + sound design neutre (silences, bruitages discrets)
