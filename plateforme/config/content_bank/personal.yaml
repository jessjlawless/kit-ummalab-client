proven_formats:
- id: lecon_face_cam
  name: Leçon / erreur du jour, face cam
  description: 'Une seule idée tirée d''un vrai moment. Court, vulnérable, utile : c''est ce qui transforme un spectateur
    curieux en fan, parce qu''il apprend en même temps que toi.'
  script_structure: hook erreur ou contrarian → ce qui s'est passé (2 phrases) → mais… (ce que j'ai compris) → donc (la règle)
    → application concrète → CTA soft
  edit_template:
    format: face cam 9:16 brute, une prise si possible, 2-3 plans B-roll illustratifs
    pacing: jump cuts serrés sur les silences, aucun effet, un punch-in 115 % sur « donc la règle c'est »
    subtitles: mot-à-mot, 2-3 mots par ligne, blanc contour noir, la règle en jaune, centre-bas
    broll:
    - écran du téléphone qui montre le moment (noms floutés)
    - plan de marche dans la rue
    - post-it ou carnet avec la règle écrite à la main
    on_screen_text: la leçon en 3-5 mots dans le tiers supérieur + la règle en carton plein écran 1,5 s avant la fin
    music: voix + sound design neutre (whoosh, clics, pop de texte)
  inspiration_urls: []
  principles:
  - S2
  - S3
  - D5
  - H-V2
  - R2
  - C4
- id: coulisses_journee
  name: 'Coulisses : une vraie journée'
  description: 'Le vlog documentaire : un moment fort, des enjeux réels, des images brutes. La régularité crée l''habitude
    de revenir, les images brutes créent la confiance.'
  script_structure: hook in medias res (le moment fort du jour) → l'enjeu d'aujourd'hui → 3-4 moments de la journée → le chiffre
    du jour → leçon en une phrase → teaser de la prochaine vidéo + CTA follow
  edit_template:
    format: 'vlog POV 9:16 : face cam à la main ou sur trépied + B-roll de la journée'
    pacing: coupe toutes les 1,5-2 s, jump cuts à chaque respiration, x2 sur les trajets, punch-in 110 % sur le chiffre du
      jour
    subtitles: mot-à-mot, 2-3 mots par ligne, blanc contour noir, chiffres et mots clés en jaune, centre-bas
    broll:
    - trajet (transports, marche)
    - mains sur le clavier
    - écran de travail (flouté si besoin)
    - carnet ou to-do du jour
    - notification qui arrive sur le téléphone
    on_screen_text: date + lieu en haut à gauche (ex. « LUN · PARIS ») + le chiffre du jour en grand quand il est dit
    music: voix + sound design neutre (whoosh, clics, pop de texte)
  inspiration_urls: []
  principles:
  - D3
  - D5
  - S4
  - F5
  - F1
  - R3
  - C3
  - H-V5
- id: bilan_chiffres
  name: Bilan chiffré / transparence totale
  description: 'La transparence sur de vrais chiffres (CA, abonnés, heures, appels) est ce qui se partage et s''enregistre
    le plus : les gens reviennent voir si ça avance vraiment.'
  script_structure: hook chiffré (où j'en suis) → écran de preuve → 3 à 5 chiffres clés → ce qui a marché / ce qui a raté
    → objectif de la semaine prochaine → CTA follow
  edit_template:
    format: face cam au bureau 9:16 + preuve plein écran (green screen ou coupe sèche)
    pacing: coupe toutes les 2 s, chaque chiffre pop + zoom sur la ligne correspondante de la preuve
    subtitles: mot-à-mot, 2-3 mots par ligne, blanc contour noir, montants en jaune, centre-bas
    broll:
    - capture d'écran du tableau de bord (montants réels ou floutés)
    - Google Sheets ou Notion de suivi
    - carnet où la semaine est barrée
    on_screen_text: « BILAN DE LA SEMAINE » en haut + chaque chiffre en grand quand il est dit
    music: voix + sound design neutre (whoosh, clics, pop de texte)
  inspiration_urls: []
  principles:
