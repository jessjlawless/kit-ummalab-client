- id: mythe_realite
  name: Mythe vs réalité (contrarian éducatif)
  description: On prend une croyance très répandue dans la niche et on la casse avec du vécu ou une preuve. Ça polarise sur
    l'idée (jamais sur une personne) et ça positionne comme expert.
  script_structure: la croyance (A) → la casser (B) → pourquoi les gens y croient → ce qui marche vraiment (2-3 points concrets)
    → la règle à retenir → CTA save
  edit_template:
    format: face cam 9:16 au bureau ou dehors + texte à l'écran « MYTHE » / « RÉALITÉ »
    pacing: coupe toutes les 1,5-2 s, whoosh sur chaque point numéroté, punch-in sur le « mais »
    subtitles: mot-à-mot, 2-3 mots par ligne, blanc contour noir, mots clés en jaune, centre-bas
    broll:
    - capture d'écran d'un conseil courant (anonymisé)
    - preuve de ton côté (résultat, écran)
    - plan de toi qui barres une ligne au marqueur
    on_screen_text: '« MYTHE : … » barré puis « RÉALITÉ : … » + gros chiffres 1/2/3 au début de chaque point'
    music: voix + sound design neutre (whoosh, clics, pop de texte)
