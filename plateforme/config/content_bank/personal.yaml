- id: methode_3_etapes
  name: Ma méthode en 3 étapes
  description: Un résultat concret, puis la méthode exacte en 3 étapes actionnables. Format qui s'enregistre beaucoup et qui
    prouve l'expertise (MOFU).
  script_structure: hook résultat (ce que la méthode permet) → pour qui → étape 1 → étape 2 → étape 3 (avec un exemple réel)
    → l'erreur à éviter → CTA mot-clé pour la version complète
  edit_template:
    format: face cam 9:16 + screen recording ou démonstration à chaque étape
    pacing: coupe toutes les 2 s, chaque étape s'ouvre sur un carton « ÉTAPE X », punch-in sur l'exemple
    subtitles: mot-à-mot, 2-3 mots par ligne, blanc contour noir, numéros d'étape en jaune, centre-bas
    broll:
