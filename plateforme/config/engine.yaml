# Configuration globale du Content Engine
timezone: Europe/Paris          # fuseau horaire (ex. Europe/Paris, America/Montreal)
db_path: data/engine.db
language: fr                 # langue des vidéos (fr | en), la fiche de tournage et le dashboard restent en français

challenge:                     # défi public optionnel (épisodes « Jour X/90 »)
  start_date: null       # Jour 1 (AAAA-MM-JJ). null = pas lancé → aucun contenu « Day X/90 », compteur ni objectif du défi
  length_days: 90
  objectif: "À_REMPLIR"        # objectif chiffré public du défi, ex. "5 000 €/mois" ou "10 000 abonnés"

scraper:
  backend: auto                # auto | apify | browser | instaloader | ytdlp | mock
  mock_fallback: false         # false = un compte qui échoue est sauté (pas de données simulées)
  lookback_days: 30
  max_videos_per_account: 50
  rescrape_after_days: 6       # cache : ne re-scrape pas un compte avant N jours
  min_delay_s: 4               # délais aléatoires entre requêtes
  max_delay_s: 12
  max_retries: 3
  apify_actors:
    instagram: apify~instagram-reel-scraper
    tiktok: clockworks~tiktok-scraper

outliers:
  threshold: 3.0               # score = vues / médiane du compte ; garde si >= seuil
  min_videos_per_account: 5    # en dessous, pas de médiane fiable → pas de score

analysis:
  max_videos_per_run: 30
  transcription: auto          # auto | openai | faster_whisper | none
  faster_whisper_model: small
  frames_at_s: [0, 1, 3, 5]
  frame_every_s: 10
  hook_window_s: 3

llm:
  provider: auto               # auto (clé API si présente, sinon Claude Code CLI = ton abonnement) | api | claude_cli | none
  cli_model: sonnet            # alias pour `claude -p --model` (sonnet | opus | haiku)
  model: claude-sonnet-5-5     # modèle pour le backend api
  vision_model: claude-sonnet-5-5
  max_tokens: 8000

synthesis:
  top_n: 5

promotion:                     # format test → éprouvé
  uplift_pct: 20               # dépasse ma médiane de X %
  min_videos: 3                # sur au moins N vidéos

calendar:
  proven_per_day: 2
  test_per_day: 1
  days: 7

feedback:
  lookback_days: 30
  match_window_days: 2         # lier une vidéo publiée à une entrée du calendrier (± N jours)

scout:                         # comptes « scout » dédiés (engine login <plateforme>, puis engine scout)
  auto_in_daily: true          # engine daily lance le scout sur les plateformes connectées
  headless: false              # scout des feeds : false = fenêtre Chrome visible (moins détectable) ; true = invisible
  profile_headless: true       # scraping des profils de référence en arrière-plan
  minutes_per_platform: 8
  max_minutes_per_day: 30
  searches_per_session: 2
  profile_scrolls: 10
  follow_reference_accounts: true   # suit les comptes de référence (signal de niche). Jamais de like/commentaire/post.
  max_follows_per_day: 5
  outlier_ratio: 1.0           # vues / abonnés de l'auteur
  min_views: 30000
  keywords:                    # mots-clés de niche (anglais), pertinence d'une vidéo du feed
    personal: []   # À ADAPTER à ta niche

references:                    # qu'est-ce qu'une bonne vidéo de référence ?
  min_replicability: 7         # 0-10 : marcherait pour un créateur inconnu grâce à sa technique
  min_hook_strength: 6         # 0-10 : force des 3 premières secondes
  allowed_drivers: [technique] # succès dû à la technique (pas célébrité, marque, animal, son tendance, actu…)
  platforms:                   # canaux d'inspiration par type de slot (ordre = priorité)
    proven: [instagram, tiktok]            # tes formats : Reels d'abord (ta plateforme principale)
    test: [instagram, tiktok, youtube]     # formats empruntés à d'autres niches : YouTube Shorts accepté
  bofu_requires_conversion: true           # BOFU : il faut un mécanisme de conversion ou un taux de commentaires ≥ x1.5

funnel:                        # mix hebdo par compte (TOFU = notoriété, MOFU = confiance, BOFU = conversion)
  personal: {tofu: 0.45, mofu: 0.35, bofu: 0.2}
